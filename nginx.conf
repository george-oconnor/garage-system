server {
        listen 80;
        listen [::]:80;
        server_name garage-system.georgeoc.com;
        return 302 https://$server_name$request_uri;
}

server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/ssl/georgeoc.com/cert.pem;
        ssl_certificate_key /etc/ssl/georgeoc.com/key.pem;
        ssl_client_certificate /etc/ssl/cloudflare.crt;
        ssl_verify_client on;

        server_name garage-system.georgeoc.com;

        if ($host != garage-system.georgeoc.com) {
                return 444;
        }

        client_max_body_size 5m;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1024;

        location /static/ {
                alias /home/george/garage-system/garage-system/garagesystem/static/;
                try_files $uri =404;
                expires 30d;
                add_header Cache-Control "public, immutable";
        }

        location /health {
                default_type text/plain;
                return 200 'ok';
        }

        location / {
                proxy_pass http://127.0.0.1:8007;
                include /etc/nginx/proxy_params;
                proxy_redirect off;
        }
}
