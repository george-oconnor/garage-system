{% extends "layout.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <div class="mb-4">
            <i class="bi bi-exclamation-triangle text-danger" style="font-size: 4rem; opacity: 0.4;"></i>
        </div>
        <h1 class="display-4 fw-bold text-muted">500</h1>
        <h4 class="mb-3">Something went wrong</h4>
        <p class="text-muted mb-2">An unexpected error occurred on the server.</p>
        {% if event_id %}
        <p class="text-muted small mb-4">Sentry event ID: <code>{{ event_id }}</code></p>
        {% endif %}
        <a href="{{ url_for('main.home') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Back to Dashboard
        </a>
    </div>
</div>
{% endblock content %}
